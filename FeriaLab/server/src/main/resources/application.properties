server.servlet.context-path=/ferialab
server.tomcat.additional-tld-skip-patterns=htmlunit-*.jar,jetty-*.jar

spring.datasource.url=${FERIALAB_DB_URL:jdbc:postgresql://localhost:5432/ferialab}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${FERIALAB_DB_USER:ferialab}
spring.datasource.password=${FERIALAB_DB_PASSWORD:ferialab_dev}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000

ferialab.web-origin=${FERIALAB_WEB_ORIGIN:http://127.0.0.1:4173}
spring.main.banner-mode=off
