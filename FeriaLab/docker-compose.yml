services:
  postgres:
    image: postgres:16-alpine
    container_name: ferialab-postgres
    environment:
      POSTGRES_DB: ferialab
      POSTGRES_USER: ferialab
      POSTGRES_PASSWORD: ferialab_dev
    ports:
      - "5432:5432"
    volumes:
      - ferialab-postgres-data:/var/lib/postgresql/data
      - ./database/postgresql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferialab -d ferialab"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  ferialab-postgres-data:
